<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Электроник S.ECM201 — Ирц ба дүн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
<style>
:root{
  --paper:#eef2f6; --surface:#ffffff; --surface2:#f6f8fb; --ink:#14304d; --text:#1c2733; --muted:#5d6b7a;
  --line:#d6dee7; --line2:#e7ecf2; --accent:#1f5f9e; --accentInk:#ffffff;
  --P:#2c7a4b; --Pbg:#e3f2e8; --A:#b4382c; --Abg:#f8e2df; --L:#a86e12; --Lbg:#f8edd6; --E:#4a5f9c; --Ebg:#e4e8f5;
  --warn:#b4382c; --shadow:0 1px 0 rgba(20,48,77,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1722; --surface:#16212e; --surface2:#1b2836; --ink:#dbe7f3; --text:#dfe6ee; --muted:#93a3b4;
    --line:#2b3a4b; --line2:#223040; --accent:#5b9ad8; --accentInk:#0b1520;
    --P:#6cc28e; --Pbg:#1b3626; --A:#f08a7d; --Abg:#3d1f1c; --L:#e2b25a; --Lbg:#3a2e17; --E:#9aaee6; --Ebg:#232c47;
    --warn:#f08a7d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1722; --surface:#16212e; --surface2:#1b2836; --ink:#dbe7f3; --text:#dfe6ee; --muted:#93a3b4;
  --line:#2b3a4b; --line2:#223040; --accent:#5b9ad8; --accentInk:#0b1520;
  --P:#6cc28e; --Pbg:#1b3626; --A:#f08a7d; --Abg:#3d1f1c; --L:#e2b25a; --Lbg:#3a2e17; --E:#9aaee6; --Ebg:#232c47;
  --warn:#f08a7d; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font:15px/1.5 "IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 18px 48px}

/* header */
header.top{background:var(--ink);color:var(--paper)}
:root[data-theme="dark"] header.top{background:#0a111a;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0a111a;color:var(--ink)}}
header.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:18px;flex-wrap:wrap}
.course{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.course h1{margin:0;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:600;font-size:clamp(26px,4vw,38px);letter-spacing:-.01em;line-height:1}
.course .code{font-size:15px;opacity:.75}
.meta{font-size:13px;opacity:.8;margin-top:6px}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9}
.dot{width:8px;height:8px;border-radius:50%;background:#8fa3b8}
.sync[data-s="ok"] .dot{background:#5fd18b}.sync[data-s="saving"] .dot{background:#f0c05a}.sync[data-s="err"] .dot{background:#ff7a6b}.sync[data-s="local"] .dot{background:#9bb3cc}
.themebtn{background:transparent;border:1px solid currentColor;border-radius:6px;padding:2px 8px;cursor:pointer;opacity:.8;font-size:12px}

nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;padding-bottom:0}
nav.tabs button{background:none;border:0;padding:13px 14px 11px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 14px}
.bar .grow{flex:1}
select,input[type=text],input[type=date],input[type=number],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-height:36px}
input[type=search]{min-width:200px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer;min-height:36px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0b1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0b1520}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.sectinfo{font-size:13px;color:var(--muted)}

/* sessions strip */
.sessions{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;line-height:1.25}
.chip small{display:block;color:var(--muted);font-size:11px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.add{border-style:dashed;color:var(--accent);font-weight:600}

.newsess{display:none;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:12px}
.newsess.open{display:flex}

/* counters */
.counts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:4px 0 12px}
.counts b{font-size:18px}
.k-P{color:var(--P)}.k-A{color:var(--A)}.k-L{color:var(--L)}.k-E{color:var(--E)}

/* roll call list */
.roll{list-style:none;margin:0;padding:0}
.roll li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line2)}
.roll li:first-child{border-top:0}
.roll .no{color:var(--muted);font-size:13px;text-align:right}
.roll .nm{font-weight:500}
.roll .cd{display:block;font-size:12px;color:var(--muted)}
.marks{display:flex;gap:4px}
.mk{width:40px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted)}
.mk[data-m="P"][aria-pressed="true"]{background:var(--Pbg);color:var(--P);border-color:var(--P)}
.mk[data-m="A"][aria-pressed="true"]{background:var(--Abg);color:var(--A);border-color:var(--A)}
.mk[data-m="L"][aria-pressed="true"]{background:var(--Lbg);color:var(--L);border-color:var(--L)}
.mk[data-m="E"][aria-pressed="true"]{background:var(--Ebg);color:var(--E);border-color:var(--E)}
.roll li[data-m="A"]{background:color-mix(in srgb,var(--Abg) 45%,transparent)}
@media (max-width:560px){.roll li{grid-template-columns:26px 1fr}.marks{grid-column:1/-1;justify-content:flex-end}.mk{width:100%;max-width:70px}}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface2);font-weight:600;color:var(--ink);text-align:left;z-index:2;font-size:12.5px;vertical-align:bottom}
th.num,td.num{text-align:right}
td.c{text-align:center}
.stick{position:sticky;left:0;background:var(--surface);z-index:1}
thead .stick{z-index:3;background:var(--surface2)}
tbody tr:hover td{background:var(--surface2)}
tbody tr:hover td.stick{background:var(--surface2)}
.cell{width:30px;height:28px;border-radius:5px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:600;font-size:12px;padding:0}
.cell[data-m="P"]{background:var(--Pbg);color:var(--P);border-color:transparent}
.cell[data-m="A"]{background:var(--Abg);color:var(--A);border-color:transparent}
.cell[data-m="L"]{background:var(--Lbg);color:var(--L);border-color:transparent}
.cell[data-m="E"]{background:var(--Ebg);color:var(--E);border-color:transparent}
.sc{width:58px;text-align:right;padding:4px 6px;min-height:30px;border-radius:5px}
input.sc::-webkit-inner-spin-button,input.sc::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input.sc{-moz-appearance:textfield;appearance:textfield}
.sc.over{border-color:var(--warn);color:var(--warn)}
.sc.auto{background:var(--surface2);color:var(--muted)}
.sc.ovr{border-color:var(--accent)}
.tot{font-weight:600}
.grade{display:inline-block;min-width:28px;text-align:center;border-radius:5px;padding:1px 6px;font-weight:700}
.g-A{background:var(--Pbg);color:var(--P)}.g-B{background:#e1edf9;color:#1f5f9e}.g-C{background:var(--Lbg);color:var(--L)}.g-D{background:var(--Ebg);color:var(--E)}.g-F{background:var(--Abg);color:var(--A)}
:root[data-theme="dark"] .g-B{background:#1c2f45;color:#8dbdf0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g-B{background:#1c2f45;color:#8dbdf0}}
.pct-low{color:var(--A);font-weight:600}
.flag{font-size:11px;color:var(--warn);display:block}
tfoot td{background:var(--surface2);font-weight:600;position:sticky;bottom:0}

/* overview */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{padding:14px 16px}
.card h3{margin:0 0 2px;font-size:15px;color:var(--ink)}
.card .big{font-size:30px;font-weight:600;color:var(--ink);line-height:1.1;margin-top:8px}
.meter{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent)}
h2{font-size:18px;color:var(--ink);margin:26px 0 10px}
.dist{display:flex;align-items:flex-end;gap:14px;height:150px;padding:16px 18px 0}
.dist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:13px}
.dist span.b{width:100%;max-width:64px;border-radius:5px 5px 0 0}
.dist label{padding:6px 0 10px;font-weight:700}

.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.settings{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:18px}
.settings .panel{padding:16px}
.settings h3{margin:0 0 10px;font-size:15px;color:var(--ink)}
.comp{display:grid;grid-template-columns:1fr 70px auto;gap:6px;align-items:center;margin-bottom:6px}
.comp .tag{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

function clone(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
function isObj(x) { return x && typeof x === "object" && !Array.isArray(x); }
function merge(t, s) { for (const k in s) { if (isObj(s[k]) && isObj(t[k])) merge(t[k], s[k]); else t[k] = clone(s[k]); } return t; }
const LS = "secm201:";

async function flush(key, retried) {

  } catch (e) {
    if (e && e.code === "invalid_argument" && !full) { st.exists[key] = false; st.pend[key] = {}; st.full[key] = true; }
    else if (e && e.code === "unavailable" && !retried) { st.pend[key] = merge(p, st.pend[key] || {}); st.busy[key] = false; setTimeout(() => flush(key, true), 800 + Math.random() * 800); return; }
    else { st.busy[key] = false; setSync("err", "Хадгалж чадсангүй — энэ төхөөрөмжид үлдлээ"); return; }
  }
  st.busy[key] = false;
  if (st.pend[key]) flush(key); else refreshSync();
}

async function initDb() {
  if (!window.claude || !window.claude.use) { refreshSync(); return; }
  let db = null;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { refreshSync(); return; }
  st.db = db; refreshSync();
  KEYS.forEach(key => {
    st.first[key] = true;
    db.doc(key).onSnapshot(snap => {
      st.exists[key] = snap.exists;
      const first = st.first[key]; st.first[key] = false;
      if (st.pend[key] || st.busy[key] || snap.metadata.hasPendingWrites) return;
      if (snap.exists) {
        const body = clone(snap.data());
        if (key === "reg/config" && !body.config) body.config = clone(DEFAULT_CONFIG);
        D[key] = body; cacheSet(key); softRender();
      } else if (first && hasContent(key)) {
        st.full[key] = true; st.pend[key] = {}; queue(key); // push local cache up
      }
    }, () => setSync("err", "Холболт тасарлаа — дахин ачаална уу"));
  });
}
function hasContent(key) {
  const d = D[key];
  if (key === "reg/config") return JSON.stringify(d.config) !== JSON.stringify(DEFAULT_CONFIG);
  if (key === "reg/scores") return Object.keys(d.s || {}).length > 0;
  return Object.keys(d.sess || {}).length > 0;
}

/* ---------- computations ---------- */
function sessions(secId) {
  const d = attDoc(secId);
  return Object.entries(d.sess || {}).filter(([, v]) => v).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.d || "").localeCompare(b.d || "") || a.id.localeCompare(b.id));
}
function mark(secId, sid, code) { const m = attDoc(secId).m || {}; return (m[sid] && m[sid][code]) || ""; }
function attStats(code, secIds) {
  const r = { P: 0, A: 0, L: 0, E: 0, n: 0 };
  (secIds || MEMBERSHIP[code] || []).forEach(sec => sessions(sec).forEach(s => { const m = mark(sec, s.id, code); if (m) { r[m]++; } r.n++; }));
  const base = r.P + r.A + r.L;
  r.rate = base ? (r.P + r.L * (cfg().lateWeight ?? 0.5)) / base : null;
  return r;
}
function compVal(code, c) {
  const v = (scores()[code] || {})[c.id];
  if (v !== undefined && v !== null && v !== "") return { v: +v, ovr: !!c.auto };
  if (c.auto) { const r = attStats(code).rate; return { v: r == null ? null : Math.round(r * c.max * 10) / 10, auto: true }; }
  return { v: null };
}
function totals(code) {
  let cont = 0, exam = 0, any = false;
  cfg().components.forEach(c => { const { v } = compVal(code, c); if (v != null) { any = true; if (c.exam) exam += v; else cont += v; } });
  const total = Math.round((cont + exam) * 10) / 10;
  return { cont: Math.round(cont * 10) / 10, exam, total, any, letter: any ? letter(total) : "" };
}
function letter(t) { for (const [g, min] of cfg().scale) if (t >= min) return g; return "F"; }
function maxCont() { return cfg().components.filter(c => !c.exam).reduce((a, c) => a + (+c.max || 0), 0); }
function maxAll() { return cfg().components.reduce((a, c) => a + (+c.max || 0), 0); }
const fmt = v => v == null ? "" : (Math.round(v * 10) / 10).toString();
const pct = r => r == null ? "—" : Math.round(r * 100) + "%";
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const shortDate = d => d ? d.slice(5).replace("-", "/") : "";
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }
function matches(code, q) { if (!q) return true; q = q.toLowerCase(); const s = ST[code]; return s.c.toLowerCase().includes(q) || s.n.toLowerCase().includes(q); }

/* ---------- Overview ---------- */
function renderOverview() {
  let h = `<h2>Ангиуд</h2><div class="grid">`;
  SECS.forEach(sec => {
    const ss = sessions(sec.id); let P = 0, L = 0, A = 0;
    sec.list.forEach(c => ss.forEach(s => { const m = mark(sec.id, s.id, c); if (m === "P") P++; else if (m === "L") L++; else if (m === "A") A++; }));
    const base = P + L + A, r = base ? (P + L * cfg().lateWeight) / base : null;
    h += `<div class="panel card"><h3>${esc(sec.name)}</h3><div class="note">${sec.list.length} оюутан · ${ss.length} хичээл</div>
      <div class="big">${pct(r)}</div><div class="note">дундаж ирц · ${A} тасалсан тохиолдол</div><div class="meter"><i style="width:${r == null ? 0 : Math.round(r * 100)}%"></i></div></div>`;
  });
  h += `</div>`;
  const dist = { A: 0, B: 0, C: 0, D: 0, F: 0 }; let graded = 0;
  ROSTER.students.forEach(s => { const t = totals(s.c); if (t.any) { graded++; dist[t.letter] = (dist[t.letter] || 0) + 1; } });
  const mx = Math.max(1, ...Object.values(dist));
  const col = { A: "var(--P)", B: "var(--accent)", C: "var(--L)", D: "var(--E)", F: "var(--A)" };
  h += `<h2>Үнэлгээний тархалт</h2><div class="panel">${graded ? `<div class="dist">` + Object.entries(dist).map(([g, v]) => `<div><span>${v}</span><span class="b" style="height:${Math.round(v / mx * 100)}%;background:${col[g] || "var(--muted)"};min-height:${v ? 3 : 0}px"></span><label>${g}</label></div>`).join("") + `</div><p class="note" style="padding:0 18px 12px;margin:0">Оноо орсон ${graded} оюутан (одоогийн оноогоор)</p>` : `<div class="empty">Дүн хэсэгт оноо оруулахад тархалт энд гарна.</div>`}</div>`;
  const risk = ROSTER.students.map(s => ({ s, r: attStats(s.c) })).filter(x => x.r.A >= 3 || (x.r.rate != null && x.r.rate < .7)).sort((a, b) => b.r.A - a.r.A);
  h += `<h2>Анхаарах оюутнууд</h2><p class="note" style="margin-top:-6px">3 ба түүнээс дээш тасалсан, эсвэл ирц 70%-иас доош</p>`;
  if (!risk.length) h += `<div class="panel empty">Одоогоор ийм оюутан алга.</div>`;
  else h += `<div class="tblwrap"><table><thead><tr><th>Оюутан</th><th>Код</th><th>Анги</th><th class="num">Тасалсан</th><th class="num">Хоцорсон</th><th class="num">Ирц</th></tr></thead><tbody>` +
    risk.map(({ s, r }) => `<tr><td>${esc(s.n)}</td><td>${s.c}</td><td>${(MEMBERSHIP[s.c] || []).map(id => esc(SEC[id].name)).join(", ")}</td><td class="num">${r.A}</td><td class="num">${r.L}</td><td class="num ${r.rate < .7 ? "pct-low" : ""}">${pct(r.rate)}</td></tr>`).join("") + `</tbody></table></div>`;
  main.innerHTML = h;
}

/* ---------- Settings ---------- */
function renderSettings() {
  const c = cfg();
  let h = `<div class="settings"><div class="panel"><h3>Үнэлгээний бүрэлдэхүүн</h3>
    <p class="note" style="margin-top:0">Нийт ${maxAll()} оноо (явц ${maxCont()}). Нэр, дээд оноог засаж болно.</p><div id="comps">` +
    c.components.map((x, i) => `<div class="comp" data-i="${i}"><input type="text" value="${esc(x.name)}" data-f="name" aria-label="Нэр"><input type="number" min="0" step="0.5" value="${x.max}" data-f="max" aria-label="Дээд оноо">
      <span>${x.auto ? `<span class="tag">ирцээс</span>` : x.exam ? `<span class="tag">шалгалт</span>` : `<button class="btn ghost danger" data-del="${i}" title="Устгах">✕</button>`}</span></div>`).join("") +
    `</div><div class="row"><button class="btn" id="addComp">+ Бүрэлдэхүүн нэмэх</button></div></div>
  <div class="panel"><h3>Дүрэм</h3>
    <div class="row"><label>Хоцролтыг ирцэд тооцох жин <select id="lw">${[[1, "бүтэн (1)"], [0.5, "хагас (0.5)"], [0, "тооцохгүй (0)"]].map(([v, t]) => `<option value="${v}"${+c.lateWeight === v ? " selected" : ""}>${t}</option>`).join("")}</select></label></div>
    <div class="row"><label>Шалгалтад орох явцын доод оноо <input type="number" id="em" min="0" step="1" value="${c.examMin || 0}" style="width:80px"></label></div>
    <p class="note">0 бол шалгахгүй. Чөлөөтэй хичээл ирцийн хувьд тооцогдохгүй.</p>
    <h3 style="margin-top:16px">Үсгэн үнэлгээний хил</h3><div class="row">` +
    c.scale.slice(0, -1).map(([g, m], i) => `<label>${g} ≥ <input type="number" data-sc="${i}" value="${m}" style="width:64px"></label>`).join("") + `</div></div>
  <div class="panel"><h3>Өгөгдөл</h3>
    <p class="note" style="margin-top:0">${st.db ? "Өгөгдөл claude.ai дээр хадгалагдаж, таны бүх төхөөрөмж дээр ижилхэн харагдана. Зөвхөн та болон засах эрхтэй хүн харна." : "Одоо зөвхөн энэ хөтчид хадгалагдаж байна. Нийтлэгдсэн хуудсаар нээвэл төхөөрөмж хооронд синк хийнэ."}</p>
    <div class="row"><button class="btn primary" id="xlsx2">Excel татах (дүн + ирц)</button><button class="btn" id="bk">Нөөц хуулбар (.json)</button>
    <label class="btn" style="display:inline-flex;align-items:center">Нөөцөөс сэргээх<input type="file" id="rs" accept=".json,application/json" hidden></label></div>
    <div class="row"><button class="btn ghost danger" id="resetCfg">Тохиргоог анхны төлөвт</button></div></div></div>`;
  main.innerHTML = h;
  const saveCfg = () => { replaceDoc("reg/config", { config: c }); };
  main.querySelectorAll(".comp input").forEach(inp => inp.onchange = () => {
    const x = c.components[+inp.closest(".comp").dataset.i];
    if (inp.dataset.f === "max") x.max = Math.max(0, +inp.value || 0); else x.name = inp.value.trim() || x.name;
    saveCfg(); renderSettings();
  });
  main.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const x = c.components[+b.dataset.del]; if (!confirm(`«${x.name}» бүрэлдэхүүнийг устгах уу? Орсон оноо харагдахаа болино.`)) return; c.components.splice(+b.dataset.del, 1); saveCfg(); renderSettings(); });
  document.getElementById("addComp").onclick = () => { const ei = c.components.findIndex(x => x.exam); const nc = { id: "c" + Date.now().toString(36), name: "Шинэ бүрэлдэхүүн", max: 5 }; if (ei < 0) c.components.push(nc); else c.components.splice(ei, 0, nc); saveCfg(); renderSettings(); };
  document.getElementById("lw").onchange = e => { c.lateWeight = +e.target.value; saveCfg(); };
  document.getElementById("em").onchange = e => { c.examMin = Math.max(0, +e.target.value || 0); saveCfg(); };
  main.querySelectorAll("[data-sc]").forEach(inp => inp.onchange = () => { c.scale[+inp.dataset.sc][1] = +inp.value || 0; saveCfg(); });
  document.getElementById("xlsx2").onclick = exportXlsx;
  document.getElementById("bk").onclick = () => saveFile("S.ECM201_нөөц_" + today() + ".json", new Blob([JSON.stringify({ v: 1, at: new Date().toISOString(), docs: D }, null, 1)], { type: "application/json" }));
  document.getElementById("rs").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (!j.docs) throw 0; if (!confirm("Одоогийн бүх өгөгдлийг нөөцөөр солих уу?")) return;
      KEYS.forEach(k => { if (j.docs[k]) replaceDoc(k, j.docs[k]); }); toast("Нөөцөөс сэргээлээ"); render();
    } catch (err) { toast("Файл таарсангүй — энэ системээс авсан .json нөөц сонгоно уу"); }
  };
  document.getElementById("resetCfg").onclick = () => { if (!confirm("Бүрэлдэхүүн, дүрмийг анхны төлөвт оруулах уу? Оноо, ирц хэвээр үлдэнэ.")) return; replaceDoc("reg/config", { config: clone(DEFAULT_CONFIG) }); renderSettings(); };
}

/* ---------- Export ---------- */
let dl = null;
function loadXLSX() {
  return new Promise((res, rej) => { if (window.XLSX) return res(window.XLSX);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => res(window.XLSX); s.onerror = rej; document.head.appendChild(s); });
}
async function saveFile(name, blob) {
  if (dl === null && window.claude && window.claude.use) { try { dl = await window.claude.use("downloads"); } catch (e) { dl = false; } }
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast("Файл хадгаллаа"); }
    catch (e) { if (e && e.code !== "declined") toast("Файл хадгалж чадсангүй"); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
async function exportXlsx() {
  toast("Excel бэлдэж байна…");
  let X; try { X = await loadXLSX(); } catch (e) { toast("Excel сан ачаалагдсангүй — интернэтээ шалгана уу"); return; }
  const wb = X.utils.book_new(), comps = cfg().components;
  const list = gradeList();
  const rows = [["№", "Оюутны код", "Овог нэр", "Сургууль", ...comps.map(c => `${c.name} (${c.max})`), `Явц (${maxCont()})`, `Нийт (${maxAll()})`, "Үнэлгээ", "Ирц %"]];
  list.forEach((code, i) => { const t = totals(code), r = attStats(code);
    rows.push([i + 1, code, ST[code].n, ST[code].s, ...comps.map(c => compVal(code, c).v ?? ""), t.any ? t.cont : "", t.any ? t.total : "", t.letter, r.rate == null ? "" : Math.round(r.rate * 100)]); });
  const ws = X.utils.aoa_to_sheet(rows); ws["!cols"] = [{ wch: 4 }, { wch: 12 }, { wch: 20 }, { wch: 8 }, ...comps.map(() => ({ wch: 10 })), { wch: 9 }, { wch: 9 }, { wch: 8 }, { wch: 7 }];
  X.utils.book_append_sheet(wb, ws, "Дүн");
  SECS.forEach(sec => {
    const ss = sessions(sec.id);
    const a = [["№", "Оюутны код", "Овог нэр", ...ss.map((s, i) => `${i + 1} (${s.d || ""})`), "Ирсэн", "Хоцорсон", "Чөлөөтэй", "Тасалсан", "Ирц %"]];
    sec.list.forEach((code, i) => { const r = attStats(code, [sec.id]);
      a.push([i + 1, code, ST[code].n, ...ss.map(s => { const m = mark(sec.id, s.id, code); return m ? MARKS[m].l : ""; }), r.P, r.L, r.E, r.A, r.rate == null ? "" : Math.round(r.rate * 100)]); });
    const w = X.utils.aoa_to_sheet(a); w["!cols"] = [{ wch: 4 }, { wch: 12 }, { wch: 20 }];
    X.utils.book_append_sheet(wb, w, ("Ирц " + sec.name.replace("·", "")).replace(/\s+/g, " ").slice(0, 31));
  });
  const buf = X.write(wb, { bookType: "xlsx", type: "array" });
  saveFile(`S.ECM201_ирц_дүн_${today()}.xlsx`, new Blob([buf]));
}

/* ---------- theme ---------- */
(function () {
  let t = null; try { t = localStorage.getItem(LS + "theme"); } catch (e) { }
  if (t) document.documentElement.dataset.theme = t;
  document.getElementById("themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const n = dark ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem(LS + "theme", n); } catch (e) { }
  };
})();

render();
initDb();
</script>
